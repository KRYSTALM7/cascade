[project]
name = "cascade-backend"
version = "0.1.0"
description = "Cascade — pre-execution consequence intelligence for AI agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "networkx>=3.3",
    "pyyaml>=6.0",
    "google-genai>=1.0",
    "python-multipart>=0.0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx2>=2.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PTH"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["N999"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["networkx.*", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: requires a reachable PostgreSQL (TEST_DATABASE_URL)",
    "live: calls the real Gemini API (skipped unless GEMINI_API_KEY is set)",
]
filterwarnings = ["error::DeprecationWarning:app.*", "error::sqlalchemy.exc.SAWarning"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
